[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltrade-messaging"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3==1.40.30",
  "prometheus-client==0.22.1",
  "psycopg2-binary==2.9.10",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.43",
]

[project.scripts]
signaltrade-outbox-publisher = "signaltrade_messaging.worker:run"

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
